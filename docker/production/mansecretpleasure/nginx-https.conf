server {
    listen 80;
    server_name mansecretpleasure.com www.mansecretpleasure.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://mansecretpleasure.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mansecretpleasure.com;
    ssl_certificate /etc/letsencrypt/live/mansecretpleasure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mansecretpleasure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://mansecretpleasure.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mansecretpleasure.com;
    root /var/www/mansecretpleasure/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 110m;

    ssl_certificate /etc/letsencrypt/live/mansecretpleasure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mansecretpleasure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MANSECRET:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/mansecretpleasure-access.log;
    error_log /var/log/nginx/mansecretpleasure-error.log;

    location ~* ^/install(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
        return 404;
    }

    location ~* "^/themes/(shop|admin)/[^/]+/build/assets/.*-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|png|jpe?g|webp|svg)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /storage/ {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
